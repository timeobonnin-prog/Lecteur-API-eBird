<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Aviaire - Décrypter une Pause</title>
    <!-- CSS de Leaflet pour la carte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* --- DESIGN ÉPURÉ, NATURE ET INFORMATIQUE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        /* Arrière-plan en mouvement perpétuel mais discret */
        body { 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            background: linear-gradient(135deg, #020504, #062115, #020504, #041009);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: #ecfdf5;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- BARRE DU HAUT --- */
        .top-bar {
            background: rgba(2, 5, 4, 0.7); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.4);
            padding: 12px 20px; display: grid; grid-template-columns: 200px 1fr auto;
            align-items: center; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* Gauche : Oiseau qui bouge légèrement */
        .brand { display: flex; align-items: center; gap: 12px; }
        .moving-bird {
            width: 35px; height: 35px; fill: #10b981;
            animation: birdHover 4s infinite ease-in-out;
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6));
        }
        @keyframes birdHover {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(4deg); }
        }
        .brand-text { font-weight: bold; color: #34d399; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem;}

        /* Milieu : Barre de recherche épurée */
        .search-wrapper { display: flex; justify-content: center; width: 100%; }
        .search-input {
            width: 100%; max-width: 500px; padding: 10px 20px;
            background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 25px; color: #fff; text-align: center; font-size: 1rem;
            outline: none; transition: 0.3s;
        }
        .search-input:focus { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); background: rgba(0,0,0,0.5); }

        /* Droite : Filtres et Clé API */
        .controls { display: flex; gap: 10px; align-items: center; }
        .tactical-select, .tactical-input, .tactical-btn {
            background: #040d08; border: 1px solid rgba(16, 185, 129, 0.4);
            color: #ecfdf5; padding: 8px 15px; border-radius: 8px; outline: none; font-size: 0.85rem; transition: 0.3s;
        }
        .tactical-input { width: 160px; }
        .tactical-input:focus, .tactical-select:focus { border-color: #10b981; }
        .tactical-btn { background: rgba(16, 185, 129, 0.1); cursor: pointer; color: #10b981; font-weight: bold; }
        .tactical-btn:hover { background: #10b981; color: #000; box-shadow: 0 0 10px #10b981; }

        /* --- CARTE AU MILIEU --- */
        .map-container {
            flex: 1; padding: 20px; display: flex; justify-content: center; align-items: center;
        }
        #map { 
            width: 100%; height: 100%; border-radius: 15px; 
            border: 1px solid rgba(16, 185, 129, 0.2); box-shadow: 0 0 30px rgba(0,0,0,0.8);
            background: #010402;
        }

        /* --- LOGO MAPS EN PETIT POUR LES POINTS --- */
        .pin-wrapper { display: flex; justify-content: center; align-items: center; transform: translate(-50%, -100%); }
        .maps-pin {
            width: 32px; height: 32px; fill: #10b981; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            animation: pulsePin 2s infinite alternate ease-in-out;
        }
        @keyframes pulsePin {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #10b981); }
            100% { transform: scale(1.1); filter: drop-shadow(0 0 8px #10b981); }
        }

        /* Popups de la carte */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #06150e !important; color: #ecfdf5 !important; border: 1px solid #10b981;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <!-- En haut à gauche : L'oiseau qui bouge -->
        <div class="brand">
            <svg class="moving-bird" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 3c-1.84 0-3.56.4-5.12 1.1A9.974 9.974 0 0 0 12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10c0-.85-.11-1.67-.31-2.46C22.61 8.52 23 7.3 23 6c0-1.66-.67-3.16-1.76-4.24C20.16 2.67 18.66 2 17 2v2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2V4c0-1.1-.9-2-2-2zM12 4c3.31 0 6.16 2.01 7.39 4.92-1.12.35-2.22.95-3.17 1.77C15.02 9.53 13.59 9 12 9c-2.76 0-5 2.24-5 5 0 1.59.71 3.02 1.83 3.97-.6.76-1.46 1.34-2.45 1.68C5.2 18.23 4 15.26 4 12c0-4.41 3.59-8 8-8zm0 7c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/>
            </svg>
            <span class="brand-text">Radar Aviaire</span>
        </div>

        <!-- Au milieu : La barre de recherche -->
        <div class="search-wrapper">
            <input type="text" id="rechercheEspece" class="search-input" placeholder="🔍 Recherche une espèce (ex: Mésange, Aigle...)" onkeyup="filtrerCarte()">
        </div>

        <!-- En haut à droite : Filtres et Clé API -->
        <div class="controls">
            <select id="filtreJours" class="tactical-select" onchange="lancerScan()">
                <option value="3">3 Jours</option>
                <option value="7">7 Jours</option>
                <option value="14" selected>14 Jours</option>
            </select>
            <select id="filtreRayon" class="tactical-select" onchange="lancerScan()">
                <option value="10">10 km</option>
                <option value="25" selected>25 km</option>
                <option value="50">50 km</option>
            </select>
            <input type="password" id="cleApiInput" class="tactical-input" placeholder="Clé API eBird...">
            <button class="tactical-btn" onclick="lancerScan()">SCAN</button>
        </div>
    </header>

    <!-- La carte au centre, entourée par l'arrière-plan en mouvement -->
    <main class="map-container">
        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
