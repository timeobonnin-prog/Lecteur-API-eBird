<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Décrypter une Pause - Observations d'Oiseaux</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #040a07;
            color: #ecfdf5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: linear-gradient(180deg, rgba(4, 10, 7, 0.85) 0%, #020504 100%), 
                              url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1920&auto=format&fit=crop');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #34d399;
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.3);
            margin-bottom: 10px;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Panneau de configuration */
        .config-card {
            background: rgba(4, 8, 7, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(52, 211, 153, 0.15);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .input-group {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        label {
            font-size: 0.85rem;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(2, 5, 4, 0.8);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 30px;
            color: #f1f5f9;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #34d399;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
        }

        .btn-search {
            padding: 14px 40px;
            background: #34d399;
            color: #020504;
            border: none;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.3);
            margin-top: 10px;
        }

        .btn-search:hover {
            background: #2ecc71;
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.5);
        }

        /* Grille de résultats */
        .birds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            text-align: left;
        }

        .bird-card {
            background: rgba(4, 8, 7, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid #34d399;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .bird-card:hover {
            transform: translateY(-4px);
            border-color: #34d399;
            background: rgba(4, 8, 7, 0.7);
        }

        .bird-icon {
            font-size: 2rem;
            display: flex;
            align-items: flex-start;
        }

        .bird-info h3 {
            font-size: 1.15rem;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .sci-name {
            font-style: italic;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .loc-name {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 10px;
        }

        .count {
            color: #34d399;
            font-weight: bold;
        }

        .date {
            color: #64748b;
        }

        /* États (chargement, erreur) */
        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Décrypter une Pause</h1>
            <p>Découvre en temps réel quels oiseaux partagent ton espace en Indre-et-Loire</p>
        </header>

        <div class="config-card">
            <div class="input-group">
                <label for="userKey">Clé de sécurité eBird API</label>
                <input id="userKey" type="password" placeholder="Colle ta clé secrète ici..." />
            </div>
            <button class="btn-search" onclick="lancerRecherche()">Scanner la Nature</button>
        </div>

        <div id="resultats" class="birds-grid">
            <div class="status-msg">Prêt à écouter. Entre ta clé et lance le scan ! 🌲</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
