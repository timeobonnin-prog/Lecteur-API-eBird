<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Aviaire Tactique</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" type="image/png" href="API Ebird.png">
    
    <style>
        /* --- VARIABLES (mode nuit par défaut) --- */
        :root {
            --neon-green: #10b981;
            --neon-glow: rgba(16, 185, 129, 0.3);
            --dark-bg: #020604;
            --panel-bg: rgba(9, 23, 16, 0.88);
            --border-line: rgba(16, 185, 129, 0.25);
            --text-light: #f8fafc;
            --text-gray: #94a3b8;
            --popup-bg: #091710;
        }

        /* --- Mode jour --- */
        body.day-mode {
            --neon-green: #059669;
            --neon-glow: rgba(5, 150, 105, 0.2);
            --dark-bg: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --border-line: rgba(5, 150, 105, 0.3);
            --text-light: #0f172a;
            --text-gray: #475569;
            --popup-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }

        body {
            background-color: var(--dark-bg); color: var(--text-light);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: 0.4s;
        }

        /* --- Écran d'authentification --- */
        #authOverlay {
            position: fixed; inset: 0; background: var(--dark-bg);
            display: flex; justify-content: center; align-items: center; z-index: 99999;
            padding: 24px; transition: all 0.5s ease;
        }
        #authOverlay.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
        
        .auth-container {
            background: var(--panel-bg); border: 2px solid var(--neon-green); box-shadow: 0 0 35px var(--neon-glow);
            border-radius: 24px; padding: 40px 30px; width: 100%; max-width: 440px; text-align: center;
        }
        .auth-container h1 { font-size: 1.9rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; color: var(--text-light); }
        .auth-container p { color: var(--neon-green); margin-bottom: 32px; text-transform: uppercase; font-size: 0.85rem; }
        
        .key-input-field {
            width: 100%; padding: 16px; background: rgba(0, 0, 0, 0.1); border: 1px solid var(--border-line);
            border-radius: 30px; color: var(--text-light); text-align: center; outline: none; margin-bottom: 24px;
        }
        .submit-scan-btn {
            width: 100%; padding: 16px; background: var(--neon-green); color: white; font-weight: bold;
            border: none; border-radius: 30px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
        }

        /* --- Barre supérieure --- */
        .top-command-bar {
            background: var(--panel-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-line);
            padding: 10px 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px;
        }
        .bar-first-row {
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand-block { display: flex; align-items: center; gap: 10px; }
        .brand-bird-svg { width: 28px; height: 28px; fill: var(--neon-green); filter: drop-shadow(0 0 6px var(--neon-green)); }
        .brand-title-text { font-size: 1.05rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        
        .control-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
        .icon-btn {
            background: transparent; border: 1px solid var(--border-line); color: var(--text-light);
            font-size: 1rem; width: 34px; height: 34px; border-radius: 8px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .icon-btn:hover { background: rgba(16, 185, 129, 0.15); }
        
        .filters-row {
            display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
        }
        .tactical-dropdown, .tactical-input-number {
            background: var(--dark-bg); border: 1px solid var(--border-line); color: var(--text-light);
            padding: 6px 10px; border-radius: 8px; outline: none; font-size: 0.85rem;
        }
        .tactical-input-number { width: 60px; text-align: center; }
        .date-input {
            background: var(--dark-bg); border: 1px solid var(--border-line); color: var(--text-light);
            padding: 6px; border-radius: 8px; width: 130px; font-size: 0.85rem;
        }

        /* --- Carte + Sidebar --- */
        .workspace-area { flex: 1; position: relative; display: flex; }
        #live-map-viewport { position: absolute; inset: 0; background: var(--dark-bg); z-index: 1; }

        #radar-sidebar-panel {
            position: absolute; top: 10px; right: 10px; bottom: 10px; width: 300px;
            background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-line);
            border-radius: 20px; z-index: 999; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .panel-header-title {
            padding: 10px; background: rgba(0, 0, 0, 0.1); border-bottom: 1px solid var(--border-line);
            display: flex; flex-direction: column; gap: 8px;
        }
        .header-top-row {
            display: flex; justify-content: space-between; align-items: center;
            font-weight: 800; color: var(--neon-green); text-transform: uppercase; font-size: 0.8rem;
        }
        .sidebar-input, .sidebar-select {
            width: 100%; padding: 8px; border-radius: 8px; background: var(--dark-bg);
            border: 1px solid var(--border-line); color: var(--text-light); outline: none; font-size: 0.8rem;
        }
        .sidebar-input:focus { border-color: var(--neon-green); }

        .birds-scroller { flex: 1; overflow-y: auto; padding: 6px; }
        .bird-card-item {
            padding: 10px; border-radius: 10px; margin-bottom: 6px; cursor: pointer;
            background: rgba(128, 128, 128, 0.05); transition: 0.2s; border-left: 3px solid transparent;
        }
        .bird-card-item:hover { background: var(--neon-glow); border-left-color: var(--neon-green); }
        .card-list-name { font-weight: bold; color: var(--text-light); font-size: 0.9rem; }
        .card-list-sub { font-size: 0.75rem; color: var(--text-gray); margin-top: 4px; }

        /* Icônes des marqueurs */
        .maps-icon-container { display: flex; justify-content: center; align-items: center; transform: translate(-50%, -100%); }
        .maps-icon-svg { width: 28px; height: 28px; fill: var(--neon-green); animation: mapsPinBounce 1.5s infinite alternate ease-in-out; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
        @keyframes mapsPinBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }

        /* Popups : descriptif du lieu + liste des espèces */
        .custom-popup-box {
            background: var(--popup-bg); color: var(--text-light); padding: 8px 10px;
            min-width: 220px; font-size: 0.85rem; line-height: 1.4;
        }
        .custom-popup-title {
            color: var(--neon-green); font-weight: bold; font-size: 0.95rem;
            margin-bottom: 4px; border-bottom: 1px solid var(--border-line); padding-bottom: 4px;
        }
        .custom-popup-info {
            font-size: 0.75rem; color: var(--text-gray); margin-bottom: 6px;
        }
        .custom-popup-species {
            margin: 0; padding: 0; list-style: none;
            max-height: 150px; overflow-y: auto;
        }
        .custom-popup-species li {
            margin-bottom: 2px;
            display: flex; justify-content: space-between;
        }
        .custom-popup-species .qte { color: var(--neon-green); font-weight: bold; }

        @media (max-width: 767px) {
            #radar-sidebar-panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 200px; }
            .birds-scroller { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; }
            .bird-card-item { flex: 0 0 220px; border-left: none; border-bottom: 3px solid transparent; }
        }
    </style>
</head>
<body>

    <!-- AUTH -->
    <div id="authOverlay">
        <div class="auth-container">
            <h1>Radar Aviaire</h1>
            <p>Système Tactique Initialisé</p>
            <input type="password" id="tokenField" class="key-input-field" placeholder="Clé API eBird..." />
            <button class="submit-scan-btn" onclick="initialiserRadar()">Activer le Radar</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="top-command-bar">
        <div class="bar-first-row">
            <div class="brand-block">
                <svg class="brand-bird-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L11 15v1c0 1.1.9 2 2 2v1.93zm5.9-3.11c-.13-.37-.51-.61-.9-.61h-.79v-2c0-.55-.45-1-1-1h-6v-2c0-.55-.45-1-1-1H6.07c-.04-.33-.07-.66-.07-1 0-3.14 1.98-5.81 4.75-6.83L13 7c.55 0 1-.45 1-1V4c3.95.49 7 3.85 7 7.93 0 1.55-.44 2.99-1.1 4.22z"/></svg>
                <span class="brand-title-text">Radar Tactique</span>
            </div>
            <div class="control-buttons">
                <button class="icon-btn" id="themeToggleBtn" onclick="basculerTheme()">🌙</button>
                <button class="icon-btn" onclick="executerScan()" title="Lancer le scan">🔄</button>
            </div>
        </div>
        <!-- Filtres -->
        <div class="filters-row">
            <input type="number" id="timeAmount" class="tactical-input-number" value="14" min="1">
            <select id="timeUnit" class="tactical-dropdown">
                <option value="1" selected>Jours</option>
                <option value="30">Mois</option>
                <option value="365">Années</option>
            </select>
            <select id="radiusSelect" class="tactical-dropdown">
                <option value="10">10 km</option>
                <option value="25" selected>25 km</option>
                <option value="50">50 km</option>
            </select>
            <input type="date" id="startDate" class="date-input" onchange="executerScan()">
            <input type="date" id="endDate" class="date-input" onchange="executerScan()">
            <button class="icon-btn" onclick="document.getElementById('startDate').value='';document.getElementById('endDate').value='';executerScan();" style="font-size:0.8rem;">✕</button>
        </div>
    </header>

    <!-- MAIN -->
    <main class="workspace-area">
        <div id="live-map-viewport"></div>

        <div id="radar-sidebar-panel">
            <div class="panel-header-title">
                <div class="header-top-row">
                    <span>Listes (Lieux)</span>
                    <span id="counter-badge" style="color:white; background:var(--neon-green); padding:2px 8px; border-radius:12px;">0</span>
                </div>
                <input type="text" id="searchInput" class="sidebar-input" placeholder="🔍 Chercher un lieu ou une espèce..." oninput="afficherInterface()" />
                <select id="sortSelect" class="sidebar-select" onchange="afficherInterface()">
                    <option value="alphabet">🔤 Tri : Ordre Alphabétique</option>
                    <option value="nombre">🔢 Tri : Nombre d'oiseaux</option>
                    <option value="date">🕒 Tri : Date la plus récente</option>
                </select>
            </div>
            
            <div id="birds-list-viewport" class="birds-scroller">
                <div style="padding:15px; text-align:center; color:var(--text-gray); font-size:0.85rem;">En attente de connexion radar...</div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, layerGroup, currentTile;
        let radarCenter = [47.3941, 0.6848]; // Centre Indre-et-Loire
        let ebirdRawData = [];
        let lieuxData = {};
        let markersList = {};
        let isNightMode = true;
        let savedToken = localStorage.getItem('ebirdToken');

        // --- THÈME ---
        function basculerTheme(forceNight = null) {
            isNightMode = forceNight !== null ? forceNight : !isNightMode;
            document.body.className = isNightMode ? '' : 'day-mode';
            document.getElementById('themeToggleBtn').innerText = isNightMode ? '🌙' : '☀️';
            
            if (currentTile) map.removeLayer(currentTile);
            const tileUrl = isNightMode 
                ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png' 
                : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png';
            currentTile = L.tileLayer(tileUrl).addTo(map);
        }

        document.addEventListener("DOMContentLoaded", () => {
            map = L.map('live-map-viewport', { zoomControl: false }).setView(radarCenter, 10);
            L.control.zoom({ position: 'bottomleft' }).addTo(map);
            layerGroup = L.layerGroup().addTo(map);
            
            const heure = new Date().getHours();
            basculerTheme(heure >= 21 || heure < 8);

            if (savedToken) document.getElementById('tokenField').value = savedToken;

            document.getElementById('tokenField').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') initialiserRadar();
            });
        });

        function initialiserRadar() {
            const token = document.getElementById('tokenField').value.trim();
            if (!token) return alert("Saisis ta clé eBird !");
            
            localStorage.setItem('ebirdToken', token);
            savedToken = token;
            document.getElementById('authOverlay').classList.add('hidden');
            setTimeout(() => { map.invalidateSize(); executerScan(); }, 400);
        }

        // --- SCAN ---
        async function executerScan() {
            if (!savedToken) return;

            document.getElementById('birds-list-viewport').innerHTML = `<div style="padding:15px; text-align:center; color:var(--neon-green); font-size:0.85rem;">Balayage en cours...</div>`;

            const radius = document.getElementById('radiusSelect').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            let back = null;
            if (!startDate || !endDate) {
                const amount = parseInt(document.getElementById('timeAmount').value) || 1;
                const unit = parseInt(document.getElementById('timeUnit').value) || 1;
                back = Math.min(amount * unit, 30);
                if (back === 30) console.warn("Limite eBird: 30 jours max.");
            }

            let url = `/api/ebird?lat=${radarCenter[0]}&lng=${radarCenter[1]}&dist=${radius}`;
            if (startDate && endDate) {
                url += `&start=${startDate}&end=${endDate}`;
            } else {
                url += `&back=${back}`;
            }

            try {
                const rep = await fetch(url, { headers: { 'x-user-ebird-key': savedToken } });
                const data = await rep.json();
                if (data.error) throw new Error(data.error);
                
                ebirdRawData = data;
                traiterDonnees();
            } catch (e) {
                document.getElementById('birds-list-viewport').innerHTML = `<div style="padding:15px; color:#f87171;">Erreur: ${e.message}</div>`;
            }
        }

        // --- REGROUPEMENT PAR LIEU ---
        function traiterDonnees() {
            lieuxData = {};
            ebirdRawData.forEach(obs => {
                const locId = obs.locId || `${obs.lat}_${obs.lng}`;
                
                if (!lieuxData[locId]) {
                    lieuxData[locId] = {
                        id: locId,
                        nomLieu: obs.locName || "Lieu inconnu",
                        lat: obs.lat,
                        lng: obs.lng,
                        observateur: obs.userDisplayName || "Anonyme",
                        dateDerniere: obs.obsDt,
                        dateObj: new Date(obs.obsDt),
                        oiseaux: [],
                        totalOiseaux: 0
                    };
                }

                // Fusionner les espèces identiques
                const existant = lieuxData[locId].oiseaux.find(o => o.nom === (obs.comName || "Inconnu"));
                if (existant) {
                    existant.qte += (obs.howMany || 1);
                } else {
                    lieuxData[locId].oiseaux.push({
                        nom: obs.comName || "Inconnu",
                        sci: obs.sciName || '',
                        qte: obs.howMany || 1
                    });
                }

                lieuxData[locId].totalOiseaux += (obs.howMany || 1);

                if (new Date(obs.obsDt) > lieuxData[locId].dateObj) {
                    lieuxData[locId].dateObj = new Date(obs.obsDt);
                    lieuxData[locId].dateDerniere = obs.obsDt;
                }
            });

            // Cercle de rayon
            layerGroup.clearLayers();
            const radius = document.getElementById('radiusSelect').value;
            L.circle(radarCenter, {
                color: '#10b981',
                fillColor: '#10b981',
                fillOpacity: 0.04,
                radius: radius * 1000,
                weight: 1
            }).addTo(layerGroup);

            afficherInterface();
        }

        const iconeRadar = L.divIcon({
            className: 'maps-icon-container',
            html: `<svg class="maps-icon-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`,
            iconSize: [28, 28], iconAnchor: [14, 28], popupAnchor: [0, -28]
        });

        // --- AFFICHAGE ---
        function afficherInterface() {
            // Supprimer les anciens marqueurs (pas le cercle)
            layerGroup.eachLayer(layer => {
                if (layer instanceof L.Marker) layerGroup.removeLayer(layer);
            });
            markersList = {};
            const listContainer = document.getElementById('birds-list-viewport');
            listContainer.innerHTML = '';

            const recherche = document.getElementById('searchInput').value.toLowerCase();
            const methodeTri = document.getElementById('sortSelect').value;

            let lieuxFiltres = Object.values(lieuxData).filter(lieu => {
                const matchLieu = lieu.nomLieu.toLowerCase().includes(recherche);
                const matchEspece = lieu.oiseaux.some(o => o.nom.toLowerCase().includes(recherche));
                return matchLieu || matchEspece;
            });

            document.getElementById('counter-badge').innerText = lieuxFiltres.length;

            if (lieuxFiltres.length === 0) {
                listContainer.innerHTML = `<div style="padding:15px; text-align:center; color:var(--text-gray);">Aucune liste trouvée.</div>`;
                return;
            }

            // Tri
            if (methodeTri === 'alphabet') {
                lieuxFiltres.sort((a, b) => a.nomLieu.localeCompare(b.nomLieu));
            } else if (methodeTri === 'nombre') {
                lieuxFiltres.sort((a, b) => b.totalOiseaux - a.totalOiseaux);
            } else if (methodeTri === 'date') {
                lieuxFiltres.sort((a, b) => b.dateObj - a.dateObj);
            }

            lieuxFiltres.forEach(lieu => {
                const dateFormatee = formatDate(lieu.dateDerniere);

                // Construction du popup : descriptif + liste des espèces
                let htmlPopup = `
                    <div class="custom-popup-box">
                        <div class="custom-popup-title">${lieu.nomLieu}</div>
                        <div class="custom-popup-info">
                            🕒 ${dateFormatee} · 👤 ${lieu.observateur}<br>
                            🦅 ${lieu.oiseaux.length} espèce(s) · 🔢 ${lieu.totalOiseaux} indiv.
                        </div>
                        <ul class="custom-popup-species">
                `;
                lieu.oiseaux.forEach(o => {
                    htmlPopup += `<li><span>${o.nom}</span> <span class="qte">x${o.qte}</span></li>`;
                });
                htmlPopup += `</ul></div>`;

                const marker = L.marker([lieu.lat, lieu.lng], { icon: iconeRadar })
                                .bindPopup(htmlPopup)
                                .addTo(layerGroup);
                markersList[lieu.id] = marker;

                // Élément du menu latéral
                const card = document.createElement('div');
                card.className = 'bird-card-item';
                card.innerHTML = `
                    <div class="card-list-name">${lieu.nomLieu}</div>
                    <div class="card-list-sub">
                        🕒 ${dateFormatee} · 👤 ${lieu.observateur}<br>
                        🦅 ${lieu.oiseaux.length} espèce(s) · 🔢 ${lieu.totalOiseaux} indiv.
                    </div>
                `;
                card.onclick = () => {
                    map.setView([lieu.lat, lieu.lng], 14);
                    markersList[lieu.id].openPopup();
                };
                listContainer.appendChild(card);
            });
        }

        function formatDate(dtString) {
            if (!dtString) return "?";
            const [date, time] = dtString.split(' ');
            const [y, m, d] = date.split('-');
            return `${d}/${m}/${y} ${time || ''}`;
        }
    </script>
</body>
</html>
