<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecteur API eBird – Sécurisé</title>
    <meta name="description" content="Explorez les observations d'oiseaux avec l'API eBird – interface protégée par CAPTCHA." />
    <meta property="og:title" content="Lecteur API eBird" />
    <meta property="og:description" content="Explorez les observations d'oiseaux avec l'API eBird." />
    <meta property="og:image" content="https://raw.githubusercontent.com/timeobonnin-prog/Lecteur-API-eBird/refs/heads/main/public/API%20Ebird.png" />
    <meta property="og:url" content="https://mon-api-ten.vercel.app" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Lecteur API eBird" />
    <meta name="twitter:description" content="Explorez les observations d'oiseaux avec l'API eBird." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/timeobonnin-prog/Lecteur-API-eBird/refs/heads/main/public/API%20Ebird.png" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/timeobonnin-prog/Lecteur-API-eBird/refs/heads/main/public/API%20Ebird.png" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/timeobonnin-prog/Lecteur-API-eBird/refs/heads/main/public/API%20Ebird.png" />
    <meta name="msapplication-TileImage" content="https://raw.githubusercontent.com/timeobonnin-prog/Lecteur-API-eBird/refs/heads/main/public/API%20Ebird.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <style>
        :root {
            --neon: #10b981;
            --glow: rgba(16, 185, 129, 0.25);
            --bg: #020604;
            --panel: rgba(9, 23, 16, 0.9);
            --border: rgba(16, 185, 129, 0.3);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --input-bg: rgba(0, 0, 0, 0.45);
            --card-bg: rgba(255, 255, 255, 0.04);
            --danger: #ef4444;
        }
        body.light {
            --neon: #059669;
            --glow: rgba(5, 150, 105, 0.2);
            --bg: #f8fafc;
            --panel: rgba(255, 255, 255, 0.94);
            --border: rgba(5, 150, 105, 0.35);
            --text: #0f172a;
            --muted: #475569;
            --input-bg: rgba(255, 255, 255, 0.8);
            --card-bg: rgba(0, 0, 0, 0.02);
            --danger: #dc2626;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; transition:0.3s; }

        #authScreen {
            position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
            z-index:99999; padding:24px; transition:0.4s;
        }
        #authScreen.hidden { opacity:0; pointer-events:none; transform:scale(1.05); }
        .auth-box {
            background:var(--panel); border:2px solid var(--neon); box-shadow:0 0 35px var(--glow);
            border-radius:28px; padding:36px 28px; width:100%; max-width:420px; text-align:center;
        }
        .auth-box h1 { font-size:1.9rem; letter-spacing:3px; text-transform:uppercase; margin-bottom:6px; }
        .auth-box p { color:var(--neon); margin-bottom:24px; font-size:0.85rem; text-transform:uppercase; }
        .auth-logo img { width:68px; height:68px; filter:drop-shadow(0 0 8px var(--neon)); }
        .api-input {
            width:100%; padding:15px 18px; background:var(--input-bg); border:1px solid var(--border);
            border-radius:30px; color:var(--text); text-align:center; font-size:0.95rem; outline:none;
            margin-bottom:12px; transition:0.2s;
        }
        .api-input:focus { border-color:var(--neon); box-shadow:0 0 12px var(--glow); }
        .api-error { color: var(--danger); font-size:0.8rem; margin-bottom:8px; display:none; }
        .captcha-container { display:flex; justify-content:center; margin-bottom:16px; }
        .btn-primary {
            width:100%; padding:15px; background:var(--neon); color:#fff; font-weight:bold; font-size:1rem;
            border:none; border-radius:30px; cursor:pointer; text-transform:uppercase; letter-spacing:1.5px;
            margin-top:8px; transition:0.2s;
        }
        .btn-primary:hover { background:#34d399; }
        .help-text { margin-top:14px; font-size:0.75rem; color:var(--muted); }
        .help-text kbd { background:rgba(255,255,255,0.1); padding:1px 6px; border-radius:4px; }

        .top-bar {
            background:var(--panel); backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
            padding:10px 12px; z-index:2000; display:flex; flex-direction:column; gap:8px;
        }
        .top-row { display:flex; justify-content:space-between; align-items:center; }
        .brand { display:flex; align-items:center; gap:8px; }
        .brand img { width:38px; height:38px; filter:drop-shadow(0 0 6px var(--neon)); }
        .brand span { font-weight:900; letter-spacing:2px; text-transform:uppercase; font-size:1rem; }
        .actions { display:flex; gap:4px; align-items:center; }
        .icon-btn {
            background:transparent; border:1px solid var(--border); color:var(--text);
            width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center;
            cursor:pointer; transition:0.2s; font-size:1rem;
        }
        .icon-btn:hover { background:rgba(16,185,129,0.15); }

        .github-container { position:relative; display:flex; align-items:center; }
        .github-popup {
            position:absolute; top:100%; right:0; margin-top:4px;
            background:var(--panel); border:1px solid var(--border);
            border-radius:12px; padding:10px; min-width:200px;
            box-shadow:0 8px 20px rgba(0,0,0,0.4); backdrop-filter:blur(12px);
            display:none; z-index:2500; font-size:0.8rem;
        }
        .github-popup a { display:block; padding:6px 8px; color:var(--text); text-decoration:none; border-radius:6px; margin-bottom:2px; }
        .github-popup a:hover { background:var(--glow); color:var(--neon); }

        .quick-filters { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
        .quick-filters select { background:var(--input-bg); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:8px; font-size:0.85rem; outline:none; }

        .main-area { flex:1; position:relative; display:flex; }
        #map { position:absolute; inset:0; background:var(--bg); z-index:1; }
        .sidebar {
            position:absolute; top:12px; right:12px; bottom:12px; width:320px;
            background:var(--panel); backdrop-filter:blur(12px); border:1px solid var(--border);
            border-radius:20px; z-index:999; display:flex; flex-direction:column; overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }
        .sidebar-header { padding:12px; background:rgba(0,0,0,0.15); border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
        .sidebar-title { display:flex; justify-content:space-between; align-items:center; font-weight:800; color:var(--neon); text-transform:uppercase; font-size:0.8rem; }
        .search-box { position:relative; }
        .search-box input { width:100%; padding:9px 12px; border-radius:8px; background:var(--input-bg); border:1px solid var(--border); color:var(--text); font-size:0.82rem; outline:none; }
        .search-box input:focus { border-color:var(--neon); }
        .autocomplete { position:absolute; top:100%; left:0; right:0; background:var(--panel); border:1px solid var(--neon); border-radius:0 0 8px 8px; max-height:150px; overflow-y:auto; display:none; z-index:20; }
        .autocomplete-item { padding:8px 12px; cursor:pointer; font-size:0.8rem; border-bottom:1px solid var(--border); }
        .autocomplete-item:hover { background:rgba(16,185,129,0.2); }
        .sort-select { width:100%; padding:8px; border-radius:8px; background:var(--input-bg); border:1px solid var(--border); color:var(--text); font-size:0.8rem; }
        .sidebar-options { display:flex; gap:8px; align-items:center; font-size:0.75rem; }
        .sidebar-options label { display:flex; align-items:center; gap:4px; cursor:pointer; }

        .checklist-scroller { flex:1; overflow-y:auto; padding:8px; }

        .checklist-card {
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            background: var(--card-bg);
            transition: 0.2s;
            border-left: 3px solid transparent;
        }
        .checklist-card:hover { background:var(--glow); border-left-color:var(--neon); }
        .checklist-card.highlight { background:var(--glow) !important; border-left-color:var(--neon) !important; }
        .checklist-name { font-weight: bold; font-size: 0.85rem; }
        .checklist-sub { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
        .species-list { display:none; margin-top:6px; padding-top:6px; border-top:1px solid var(--border); font-size: 0.75rem; }
        .checklist-card.expanded .species-list { display:block; }
        .species-list ul { list-style:none; padding:0; margin:0; }
        .species-list li { display:flex; justify-content:space-between; margin-bottom:2px; }
        .species-list .qty { color:var(--neon); font-weight:bold; }
        .ebird-link { display:inline-block; margin-top:6px; color:var(--neon); font-size:0.7rem; font-weight:bold; text-decoration:none; border:1px solid var(--border); padding:2px 6px; border-radius:6px; }
        .ebird-link:hover { background:rgba(16,185,129,0.15); }

        .map-marker svg { width:26px; height:26px; animation:bounce 1.8s infinite alternate; }
        @keyframes bounce { 0%{transform:translateY(0);} 100%{transform:translateY(-3px);} }

        .toggle-list-btn {
            display:none; background:var(--neon); color:#fff; border:none; border-radius:8px;
            padding:6px 10px; font-size:0.8rem; cursor:pointer; position:absolute; top:6px; right:6px; z-index:1000;
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--neon);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal {
            position: fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100000;
            display:none; align-items:center; justify-content:center;
        }
        .modal.active { display:flex; }
        .modal-content {
            background:var(--panel); border:1px solid var(--neon); border-radius:16px;
            padding:24px; width:90%; max-width:400px; color:var(--text);
        }
        .modal-content h3 { margin-bottom:16px; text-align:center; }
        .format-options { display:flex; justify-content:center; gap:16px; margin-bottom:20px; }
        .format-options label { cursor:pointer; display:flex; align-items:center; gap:6px; }
        .modal-btn {
            background:var(--neon); color:#fff; border:none; border-radius:8px;
            padding:10px 20px; font-weight:bold; cursor:pointer; width:100%;
        }

        @media (max-width:767px) {
            .sidebar { top:auto; left:0; right:0; bottom:0; width:100%; height:30vh; max-height:250px; border-radius:20px 20px 0 0; transition:height 0.3s; }
            .sidebar.collapsed { height:40px; }
            .sidebar.collapsed .sidebar-header, .sidebar.collapsed .checklist-scroller { display:none; }
            .toggle-list-btn { display:block; }
            .checklist-card { padding: 6px; margin-bottom: 4px; }
            .checklist-name { font-size: 0.8rem; }
            .checklist-sub { font-size: 0.65rem; }
            .species-list { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="auth-box">
        <a href="https://ebird.org/api/keygen" target="_blank" class="auth-logo"><img src="API Ebird.png" alt="logo" /></a>
        <h1>Lecteur API eBird</h1>
        <p>Sécurisé • Vercel</p>
        <input type="password" id="apiKeyField" class="api-input" placeholder="Colle ta clé API eBird…" autocomplete="off" />
        <div id="apiKeyError" class="api-error">Clé API invalide. Vérifiez votre clé.</div>
        <div class="captcha-container">
            <div class="h-captcha" data-sitekey="d3f4d0c2-9bb0-49c2-8af8-6d6e8474f990"></div>
        </div>
        <button class="btn-primary" onclick="startRadar()">🔍 Activer le Scanner</button>
        <div class="help-text">
            <kbd>Entrée</kbd> pour valider • Clé sur <a href="https://ebird.org/api/keygen" target="_blank" style="color:var(--neon);">ebird.org/api/keygen</a>
        </div>
    </div>
</div>

<header class="top-bar">
    <div class="top-row">
        <div class="brand">
            <img src="API Ebird.png" alt="Lecteur API eBird" />
            <span>Lecteur API eBird</span>
        </div>
        <div class="actions">
            <button class="icon-btn" onclick="centerOnUser()" title="Centrer sur ma position">📍</button>
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <select id="mapLayerSelect" onchange="changeMapLayer(this.value)" style="background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:4px;border-radius:6px;font-size:0.75rem;">
                <option value="dark">Sombre</option>
                <option value="light">Clair</option>
                <option value="satellite">Satellite</option>
                <option value="topo">Topographique</option>
            </select>
            <button class="icon-btn" onclick="logout()" title="Se déconnecter">🏠</button>
            <div class="github-container" id="githubContainer">
                <div class="icon-btn" id="githubIcon">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                </div>
                <div class="github-popup" id="githubPopup">
                    <a href="https://github.com/timeobonnin-prog/mon-api/issues/new?template=feature_request.md" target="_blank">📝 Proposer une fonctionnalité</a>
                    <a href="https://github.com/timeobonnin-prog/mon-api" target="_blank">💻 Contribuer</a>
                </div>
            </div>
        </div>
    </div>
    <div class="quick-filters">
        <select id="radiusSelect" onchange="runScan()">
            <option value="10">10 km</option>
            <option value="25">25 km</option>
            <option value="50" selected>50 km</option>
        </select>
    </div>
</header>

<main class="main-area">
    <div id="map"></div>
    <button class="toggle-list-btn" id="toggleListBtn">▼</button>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title"><span>Checklists</span><span id="checklistCount" style="color:#fff; background:var(--neon); padding:2px 8px; border-radius:12px;">0</span></div>
            <div id="speciesTotal" style="font-size:0.7rem; color:var(--muted); text-align:center;">0 espèce distincte</div>
            <div id="totalBirdsCount" style="font-size:0.7rem; color:var(--muted); text-align:center;">0 individus</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Lieu ou espèce..." oninput="updateAutocomplete()" autocomplete="off" />
                <div class="autocomplete" id="autocompleteList"></div>
            </div>
            <select class="sort-select" id="sortSelect" onchange="renderChecklists()">
                <option value="alpha">🔤 Alphabétique</option>
                <option value="count">🔢 Nombre d'oiseaux</option>
                <option value="date">🕒 Plus récent</option>
            </select>
            <div class="sidebar-options">
                <label>
                    <input type="checkbox" id="showSciNames" onchange="renderChecklists()"> Noms scientifiques
                </label>
                <button class="ebird-link" onclick="openExportModal()">📥 Exporter</button>
            </div>
        </div>
        <div class="checklist-scroller" id="checklistContainer">
            <div style="padding:20px; text-align:center; color:var(--muted);">Prêt à scanner…</div>
        </div>
    </div>
</main>

<!-- MODALE EXPORT -->
<div class="modal" id="exportModal">
    <div class="modal-content">
        <h3>Exporter les observations</h3>
        <p style="text-align:center; margin-bottom:12px;">Format :</p>
        <div class="format-options">
            <label><input type="radio" name="exportFormat" value="csv" checked> CSV</label>
            <label><input type="radio" name="exportFormat" value="txt"> TXT</label>
            <label><input type="radio" name="exportFormat" value="json"> JSON</label>
        </div>
        <button class="modal-btn" onclick="doExport()">📥 Télécharger</button>
        <button style="background:transparent; border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:8px; margin-top:8px; width:100%; cursor:pointer;" onclick="closeExportModal()">Annuler</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const escapeHtml = (str) => String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g,'').toLowerCase();

    let userApiKey = null;
    let map, layerGroup, tileLayer;
    let center = [47.3941, 0.6848];
    let rawObservations = [];
    let checklists = {};
    let markerRefs = {};
    let cardRefs = {};
    let nightMode = true;
    let autocompleteTimer;
    let taxonomy = [];
    let currentSpeciesCode = null;
    let speciesChecklists = {};
    let userPosition = null;

    const mapLayers = {
        dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
        light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
        satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        topo: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png'
    };
    let currentMapLayer = 'dark';
    let markerColor = '#ffffff';

    function updateMarkerColor() {
        markerColor = (currentMapLayer === 'dark') ? '#ffffff' : '#000000';
    }

    function getMarkerIcon() {
        return L.divIcon({
            className: 'map-marker',
            html: `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="${markerColor}"/></svg>`,
            iconSize: [26,26],
            iconAnchor: [13,26],
            popupAnchor: [0,-26]
        });
    }

    function changeMapLayer(layerName) {
        currentMapLayer = layerName;
        localStorage.setItem('mapLayer', layerName);
        updateMarkerColor();
        if (tileLayer) map.removeLayer(tileLayer);
        tileLayer = L.tileLayer(mapLayers[layerName], {
            attribution: layerName === 'satellite' ? 'Esri' : layerName === 'topo' ? 'OpenTopoMap' : 'CartoDB'
        }).addTo(map);
        if (Object.keys(checklists).length > 0 || Object.keys(speciesChecklists).length > 0) {
            renderChecklists();
        }
    }

    function toggleTheme(force = null) {
        nightMode = force !== null ? force : !nightMode;
        localStorage.setItem('themeMode', nightMode ? 'dark' : 'light');
        document.body.className = nightMode ? '' : 'light';
        document.getElementById('themeBtn').innerText = nightMode ? '🌙' : '☀️';
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function centerOnUser() {
        if (!navigator.geolocation) { alert("Géolocalisation indisponible"); return; }
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                userPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                center = [userPosition.lat, userPosition.lng];
                map.setView(center, 12);
                renderChecklists();
            },
            (err) => { alert("Position impossible à obtenir"); console.error(err); }
        );
    }

    // Connexion automatique
    async function tryAutoLogin() {
        const savedKey = localStorage.getItem('ebirdApiKey');
        if (!savedKey) return false;
        try {
            const testRes = await fetch('/api/ebird-taxonomy', { headers: { 'x-user-ebird-key': savedKey } });
            if (!testRes.ok) {
                localStorage.removeItem('ebirdApiKey');
                return false;
            }
            userApiKey = savedKey;
            document.getElementById('authScreen').classList.add('hidden');
            await loadTaxonomy();
            setTimeout(() => { map.invalidateSize(); runScan(); }, 400);
            return true;
        } catch (err) {
            localStorage.removeItem('ebirdApiKey');
            return false;
        }
    }

    function logout() {
        localStorage.removeItem('ebirdApiKey');
        userApiKey = null;
        rawObservations = [];
        checklists = {};
        speciesChecklists = {};
        currentSpeciesCode = null;
        if (layerGroup) layerGroup.clearLayers();
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('apiKeyField').value = '';
        document.getElementById('apiKeyError').style.display = 'none';
        document.getElementById('apiKeyField').focus();
        if (typeof hcaptcha !== 'undefined') hcaptcha.reset();
        document.getElementById('checklistContainer').innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted);">Prêt à scanner…</div>';
        document.getElementById('speciesTotal').textContent = '0 espèce distincte';
        document.getElementById('totalBirdsCount').textContent = '0 individus';
        document.getElementById('checklistCount').textContent = '0';
    }

    async function startRadar() {
        const token = document.getElementById('apiKeyField').value.trim();
        const errorDiv = document.getElementById('apiKeyError');
        errorDiv.style.display = 'none';

        if (!token) { errorDiv.textContent = 'Veuillez saisir une clé API.'; errorDiv.style.display = 'block'; return; }
        const hcaptchaResponse = hcaptcha.getResponse();
        if (!hcaptchaResponse) { errorDiv.textContent = 'Veuillez résoudre le CAPTCHA.'; errorDiv.style.display = 'block'; return; }

        try {
            const verifyRes = await fetch('/api/verify-captcha', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: hcaptchaResponse })
            });
            const verifyData = await verifyRes.json();
            if (!verifyData.success) throw new Error(verifyData.error || 'CAPTCHA invalide');
        } catch (err) {
            errorDiv.textContent = 'Échec vérification CAPTCHA : ' + err.message;
            errorDiv.style.display = 'block';
            return;
        }

        try {
            const testRes = await fetch('/api/ebird-taxonomy', { headers: { 'x-user-ebird-key': token } });
            if (!testRes.ok) {
                if (testRes.status === 401 || testRes.status === 403) throw new Error('Clé API invalide');
                else throw new Error('Erreur de connexion');
            }
        } catch (err) {
            errorDiv.textContent = err.message === 'Clé API invalide' ? 'Clé API invalide. Vérifiez votre clé.' : 'Impossible de vérifier la clé.';
            errorDiv.style.display = 'block';
            return;
        }

        localStorage.setItem('ebirdApiKey', token);
        userApiKey = token;
        document.getElementById('authScreen').classList.add('hidden');
        loadTaxonomy();
        setTimeout(() => { map.invalidateSize(); runScan(); }, 400);
    }

    async function loadTaxonomy() {
        try {
            const res = await fetch('/api/ebird-taxonomy', { headers: { 'x-user-ebird-key': userApiKey } });
            if (!res.ok) throw new Error('Erreur taxonomie');
            taxonomy = await res.json();
        } catch (err) { console.error('Taxonomie indisponible'); }
    }

    function findSpeciesCode(frenchName) {
        const normalizedInput = normalize(frenchName);
        const match = taxonomy.find(s => normalize(s.comName) === normalizedInput);
        return match ? match.speciesCode : null;
    }

    function showLoading() {
        document.getElementById('checklistContainer').innerHTML = '<div class="spinner"></div>';
    }

    async function runScan() {
        if (!userApiKey || currentSpeciesCode) return;
        showLoading();
        const radius = document.getElementById('radiusSelect').value;
        const url = `/api/ebird?lat=${center[0]}&lng=${center[1]}&dist=${radius}&maxResults=10000`;
        try {
            const res = await fetch(url, { headers: { 'x-user-ebird-key': userApiKey } });
            if (!res.ok) throw new Error("Erreur serveur : " + await res.text());
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            rawObservations = data;
            buildChecklists();
        } catch (err) {
            document.getElementById('checklistContainer').innerHTML = `<div style="padding:20px; color:#f87171;">${escapeHtml(err.message)}</div>`;
        }
    }

    function buildChecklists() {
        checklists = {};
        rawObservations.forEach(obs => {
            const subId = obs.subId; if (!subId) return;
            if (!checklists[subId]) {
                checklists[subId] = {
                    id: subId, name: obs.locName || 'Lieu inconnu', lat: obs.lat, lng: obs.lng,
                    observer: obs.userDisplayName || 'Anonyme', lastDate: obs.obsDt,
                    dateObj: new Date(obs.obsDt), species: [], totalBirds: 0
                };
            }
            const existing = checklists[subId].species.find(s => s.name === obs.comName);
            if (existing) existing.count += (obs.howMany || 1);
            else checklists[subId].species.push({ name: obs.comName || 'Inconnu', sci: obs.sciName || '', count: obs.howMany || 1 });
            checklists[subId].totalBirds += (obs.howMany || 1);
            if (new Date(obs.obsDt) > checklists[subId].dateObj) {
                checklists[subId].dateObj = new Date(obs.obsDt);
                checklists[subId].lastDate = obs.obsDt;
            }
        });
        layerGroup.clearLayers();
        L.circle(center, { color:'#10b981', fillColor:'#10b981', fillOpacity:0.04, radius: document.getElementById('radiusSelect').value*1000, weight:1 }).addTo(layerGroup);
        renderChecklists();
    }

    // ========== AUTOCOMPLÉTION FONCTIONNELLE ==========
    function updateAutocomplete() {
        clearTimeout(autocompleteTimer);
        autocompleteTimer = setTimeout(() => {
            const input = document.getElementById('searchInput');
            const query = normalize(input.value.trim());
            const list = document.getElementById('autocompleteList');
            if (!query) {
                list.style.display = 'none';
                if (currentSpeciesCode) { currentSpeciesCode = null; speciesChecklists = {}; renderChecklists(); }
                return;
            }
            const suggestions = [];
            if (taxonomy.length > 0) {
                taxonomy.filter(s => normalize(s.comName).includes(query)).slice(0,5).forEach(s => suggestions.push(s.comName));
            }
            if (suggestions.length === 0) {
                const unique = new Set();
                Object.values(checklists).forEach(cl => cl.species.forEach(s => { if (normalize(s.name).includes(query)) unique.add(s.name); }));
                Array.from(unique).slice(0,5).forEach(s => suggestions.push(s));
            }
            if (suggestions.length) {
                list.innerHTML = suggestions.map(s => `<div class="autocomplete-item">${escapeHtml(s)}</div>`).join('');
                list.querySelectorAll('.autocomplete-item').forEach(item => item.addEventListener('click', () => {
                    const name = item.textContent;
                    input.value = name; list.style.display = 'none';
                    const code = findSpeciesCode(name);
                    if (code) { currentSpeciesCode = code; fetchSpeciesChecklists(code); }
                    else alert('Code espèce introuvable.');
                }));
                list.style.display = 'block';
            } else list.style.display = 'none';
        }, 300);
    }

    async function fetchSpeciesChecklists(speciesCode) {
        showLoading();
        const radius = parseInt(document.getElementById('radiusSelect').value, 10);
        const url = `/api/ebird-nearest?lat=${center[0]}&lng=${center[1]}&code=${speciesCode}&back=30&maxResults=2000`;
        try {
            const res = await fetch(url, { headers: { 'x-user-ebird-key': userApiKey } });
            const data = await res.json();
            const filteredData = data.filter(obs => calculateDistance(center[0], center[1], obs.lat, obs.lng) <= radius);
            buildSpeciesChecklists(filteredData);
        } catch (err) {
            document.getElementById('checklistContainer').innerHTML = `<div style="padding:20px; color:#f87171;">${escapeHtml(err.message)}</div>`;
        }
    }

    function buildSpeciesChecklists(observations) {
        speciesChecklists = {};
        observations.forEach(obs => {
            const subId = obs.subId; if (!subId) return;
            if (!speciesChecklists[subId]) {
                speciesChecklists[subId] = {
                    id: subId, name: obs.locName || 'Lieu inconnu', lat: obs.lat, lng: obs.lng,
                    observer: obs.userDisplayName || 'Anonyme', lastDate: obs.obsDt,
                    dateObj: new Date(obs.obsDt), species: [], totalBirds: 0
                };
            }
            const existing = speciesChecklists[subId].species.find(s => s.name === obs.comName);
            if (existing) existing.count += (obs.howMany || 1);
            else speciesChecklists[subId].species.push({ name: obs.comName || 'Inconnu', sci: obs.sciName || '', count: obs.howMany || 1 });
            speciesChecklists[subId].totalBirds += (obs.howMany || 1);
            if (new Date(obs.obsDt) > speciesChecklists[subId].dateObj) {
                speciesChecklists[subId].dateObj = new Date(obs.obsDt);
                speciesChecklists[subId].lastDate = obs.obsDt;
            }
        });
        renderSpeciesChecklists();
    }

    function renderSpeciesChecklists() {
        layerGroup.eachLayer(l => { if (l instanceof L.Marker) layerGroup.removeLayer(l); });
        markerRefs = {}; cardRefs = {};
        const container = document.getElementById('checklistContainer'); container.innerHTML = '';
        const sort = document.getElementById('sortSelect').value;
        const showSci = document.getElementById('showSciNames').checked;
        let filtered = Object.values(speciesChecklists);
        const distinct = new Set(); filtered.forEach(cl => cl.species.forEach(s => distinct.add(s.name)));
        const totalBirds = filtered.reduce((sum, cl) => sum + cl.totalBirds, 0);
        document.getElementById('speciesTotal').textContent = distinct.size + ' espèce(s) distincte(s)';
        document.getElementById('totalBirdsCount').textContent = totalBirds + ' individus';
        document.getElementById('checklistCount').textContent = filtered.length;
        if (!filtered.length) {
            container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted);">Aucune checklist pour cette espèce.</div>';
            return;
        }
        if (sort === 'alpha') filtered.sort((a,b) => a.name.localeCompare(b.name));
        else if (sort === 'count') filtered.sort((a,b) => b.totalBirds - a.totalBirds);
        else if (sort === 'date') filtered.sort((a,b) => b.dateObj - a.dateObj);
        const icon = getMarkerIcon();
        filtered.forEach(cl => {
            const marker = L.marker([cl.lat, cl.lng], { icon }).addTo(layerGroup);
            markerRefs[cl.id] = marker;
            marker.on('click', () => {
                const card = cardRefs[cl.id];
                if (card) { card.scrollIntoView({ behavior:'smooth', block:'center' }); card.classList.add('highlight'); if(!card.classList.contains('expanded')) card.classList.add('expanded'); setTimeout(() => card.classList.remove('highlight'), 1500); }
            });
            let distanceHtml = '';
            if (userPosition) {
                const dist = calculateDistance(userPosition.lat, userPosition.lng, cl.lat, cl.lng).toFixed(1);
                distanceHtml = ` · 📏 ${dist} km`;
            }
            const card = document.createElement('div'); card.className = 'checklist-card';
            card.innerHTML = `
                <div class="checklist-name">${escapeHtml(cl.name)}</div>
                <div class="checklist-sub">🕒 ${formatDate(cl.lastDate)} · 👤 ${escapeHtml(cl.observer)}${distanceHtml}<br>🦅 ${cl.species.length} espèce(s) · 🔢 ${cl.totalBirds} indiv.</div>
                <div class="species-list">
                    <ul>${cl.species.map(s => `<li><span>${escapeHtml(s.name)} ${showSci ? `<em>(${escapeHtml(s.sci)})</em>` : ''}</span> <span class="qty">x${s.count}</span></li>`).join('')}</ul>
                    <a href="https://ebird.org/checklist/${cl.id}" target="_blank" class="ebird-link">🔗 Voir eBird</a>
                </div>`;
            card.addEventListener('mouseenter', () => map.setView([cl.lat, cl.lng], map.getZoom(), { animate: true, duration: 0.3 }));
            card.addEventListener('click', () => { map.setView([cl.lat, cl.lng], 12); card.classList.toggle('expanded'); });
            cardRefs[cl.id] = card; container.appendChild(card);
        });
    }

    function renderChecklists() {
        if (currentSpeciesCode) { renderSpeciesChecklists(); return; }
        layerGroup.eachLayer(l => { if (l instanceof L.Marker) layerGroup.removeLayer(l); });
        markerRefs = {}; cardRefs = {};
        const container = document.getElementById('checklistContainer'); container.innerHTML = '';
        const query = normalize(document.getElementById('searchInput').value);
        const sort = document.getElementById('sortSelect').value;
        const showSci = document.getElementById('showSciNames').checked;
        let filtered = Object.values(checklists).filter(cl => {
            return normalize(cl.name).includes(query) || cl.species.some(s => normalize(s.name).includes(query));
        });
        const distinct = new Set(); filtered.forEach(cl => cl.species.forEach(s => distinct.add(s.name)));
        const totalBirds = filtered.reduce((sum, cl) => sum + cl.totalBirds, 0);
        document.getElementById('speciesTotal').textContent = distinct.size + ' espèce(s) distincte(s)';
        document.getElementById('totalBirdsCount').textContent = totalBirds + ' individus';
        document.getElementById('checklistCount').textContent = filtered.length;
        if (!filtered.length) {
            container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted);">Aucune checklist.</div>';
            return;
        }
        if (sort === 'alpha') filtered.sort((a,b) => a.name.localeCompare(b.name));
        else if (sort === 'count') filtered.sort((a,b) => b.totalBirds - a.totalBirds);
        else if (sort === 'date') filtered.sort((a,b) => b.dateObj - a.dateObj);
        const icon = getMarkerIcon();
        filtered.forEach(cl => {
            const marker = L.marker([cl.lat, cl.lng], { icon }).addTo(layerGroup);
            markerRefs[cl.id] = marker;
            marker.on('click', () => {
                const card = cardRefs[cl.id];
                if (card) { card.scrollIntoView({ behavior:'smooth', block:'center' }); card.classList.add('highlight'); if(!card.classList.contains('expanded')) card.classList.add('expanded'); setTimeout(() => card.classList.remove('highlight'), 1500); }
            });
            let distanceHtml = '';
            if (userPosition) {
                const dist = calculateDistance(userPosition.lat, userPosition.lng, cl.lat, cl.lng).toFixed(1);
                distanceHtml = ` · 📏 ${dist} km`;
            }
            const card = document.createElement('div'); card.className = 'checklist-card';
            card.innerHTML = `
                <div class="checklist-name">${escapeHtml(cl.name)}</div>
                <div class="checklist-sub">🕒 ${formatDate(cl.lastDate)} · 👤 ${escapeHtml(cl.observer)}${distanceHtml}<br>🦅 ${cl.species.length} espèce(s) · 🔢 ${cl.totalBirds} indiv.</div>
                <div class="species-list">
                    <ul>${cl.species.map(s => `<li><span>${escapeHtml(s.name)} ${showSci ? `<em>(${escapeHtml(s.sci)})</em>` : ''}</span> <span class="qty">x${s.count}</span></li>`).join('')}</ul>
                    <a href="https://ebird.org/checklist/${cl.id}" target="_blank" class="ebird-link">🔗 Voir eBird</a>
                </div>`;
            card.addEventListener('mouseenter', () => map.setView([cl.lat, cl.lng], map.getZoom(), { animate: true, duration: 0.3 }));
            card.addEventListener('click', () => { map.setView([cl.lat, cl.lng], 12); card.classList.toggle('expanded'); });
            cardRefs[cl.id] = card; container.appendChild(card);
        });
    }

    // Export
    function openExportModal() { document.getElementById('exportModal').classList.add('active'); }
    function closeExportModal() { document.getElementById('exportModal').classList.remove('active'); }

    function doExport() {
        let dataSource;
        if (currentSpeciesCode) {
            dataSource = Object.values(speciesChecklists).flatMap(cl => cl.species.map(s => ({
                ...s, locName: cl.name, lat: cl.lat, lng: cl.lng, obsDt: cl.lastDate, subId: cl.id, observer: cl.observer
            })));
        } else {
            const query = normalize(document.getElementById('searchInput').value);
            const filtered = Object.values(checklists).filter(cl => normalize(cl.name).includes(query) || cl.species.some(s => normalize(s.name).includes(query)));
            const subIds = new Set(filtered.map(cl => cl.id));
            dataSource = rawObservations.filter(obs => subIds.has(obs.subId));
        }
        if (dataSource.length === 0) { alert('Aucune donnée à exporter.'); return; }

        const format = document.querySelector('input[name="exportFormat"]:checked').value;
        const headers = [
            "GLOBAL UNIQUE IDENTIFIER","LAST EDITED DATE","TAXONOMIC ORDER","CATEGORY",
            "TAXON CONCEPT ID","COMMON NAME","SCIENTIFIC NAME","SUBSPECIES COMMON NAME",
            "SUBSPECIES SCIENTIFIC NAME","EXOTIC CODE","OBSERVATION COUNT","BREEDING CODE",
            "BREEDING CATEGORY","BEHAVIOR CODE","AGE/SEX","COUNTRY","COUNTRY CODE",
            "STATE","STATE CODE","COUNTY","COUNTY CODE","IBA CODE","BCR CODE",
            "USFWS CODE","ATLAS BLOCK","LOCALITY","LOCALITY ID","LOCALITY TYPE",
            "LATITUDE","LONGITUDE","OBSERVATION DATE","TIME OBSERVATIONS STARTED",
            "OBSERVER ID","OBSERVER ORCID ID","SAMPLING EVENT IDENTIFIER","OBSERVATION TYPE",
            "PROTOCOL NAME","PROTOCOL CODE","PROJECT NAMES","PROJECT IDENTIFIERS",
            "DURATION MINUTES","EFFORT DISTANCE KM","EFFORT AREA HA","NUMBER OBSERVERS",
            "ALL SPECIES REPORTED","GROUP IDENTIFIER","HAS MEDIA","APPROVED","REVIEWED",
            "REASON","CHECKLIST COMMENTS","SPECIES COMMENTS"
        ];

        const lines = [];
        if (format !== 'json') lines.push(headers.join(format === 'txt' ? '\t' : ','));

        dataSource.forEach(obs => {
            const row = {
                "GLOBAL UNIQUE IDENTIFIER": obs.subId ? `URN:CornellLabOfOrnithology:EBIRD:OBS${obs.subId}` : '',
                "LAST EDITED DATE": '',
                "TAXONOMIC ORDER": '',
                "CATEGORY": 'species',
                "TAXON CONCEPT ID": obs.sciName || '',
                "COMMON NAME": obs.comName || '',
                "SCIENTIFIC NAME": obs.sciName || '',
                "SUBSPECIES COMMON NAME": '',
                "SUBSPECIES SCIENTIFIC NAME": '',
                "EXOTIC CODE": '',
                "OBSERVATION COUNT": obs.howMany || 1,
                "BREEDING CODE": '',
                "BREEDING CATEGORY": '',
                "BEHAVIOR CODE": '',
                "AGE/SEX": '',
                "COUNTRY": '',
                "COUNTRY CODE": '',
                "STATE": '',
                "STATE CODE": '',
                "COUNTY": '',
                "COUNTY CODE": '',
                "IBA CODE": '',
                "BCR CODE": '',
                "USFWS CODE": '',
                "ATLAS BLOCK": '',
                "LOCALITY": obs.locName || '',
                "LOCALITY ID": obs.locId || '',
                "LOCALITY TYPE": '',
                "LATITUDE": obs.lat || '',
                "LONGITUDE": obs.lng || '',
                "OBSERVATION DATE": obs.obsDt ? obs.obsDt.split(' ')[0] : '',
                "TIME OBSERVATIONS STARTED": obs.obsDt ? obs.obsDt.split(' ')[1] || '' : '',
                "OBSERVER ID": obs.observer || obs.userDisplayName || '',
                "OBSERVER ORCID ID": '',
                "SAMPLING EVENT IDENTIFIER": obs.subId || '',
                "OBSERVATION TYPE": 'Recent',
                "PROTOCOL NAME": '',
                "PROTOCOL CODE": '',
                "PROJECT NAMES": '',
                "PROJECT IDENTIFIERS": '',
                "DURATION MINUTES": '',
                "EFFORT DISTANCE KM": '',
                "EFFORT AREA HA": '',
                "NUMBER OBSERVERS": '',
                "ALL SPECIES REPORTED": '',
                "GROUP IDENTIFIER": '',
                "HAS MEDIA": '',
                "APPROVED": '',
                "REVIEWED": '',
                "REASON": '',
                "CHECKLIST COMMENTS": '',
                "SPECIES COMMENTS": ''
            };
            lines.push(headers.map(h => {
                let val = row[h] !== undefined ? row[h] : '';
                if (format === 'csv') return '"' + String(val).replace(/"/g, '""') + '"';
                else if (format === 'txt') return String(val).replace(/\t/g, ' ');
                else return val;
            }).join(format === 'txt' ? '\t' : ','));
        });

        let content = lines.join('\n');
        if (format === 'json') {
            const jsonData = dataSource.map(obs => {
                const obj = {};
                headers.forEach(h => obj[h] = (obs[h] || ''));
                return obj;
            });
            content = JSON.stringify(jsonData, null, 2);
        }

        const mimeMap = { csv: 'text/csv;charset=utf-8;', txt: 'text/plain;charset=utf-8;', json: 'application/json;charset=utf-8;' };
        const blob = new Blob([content], { type: mimeMap[format] });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        const today = new Date().toISOString().split('T')[0];
        link.download = `ebird_export_${today}.${format}`;
        link.click();
        URL.revokeObjectURL(url);
        closeExportModal();
    }

    function formatDate(dt) {
        if (!dt) return '?';
        const [date, time] = dt.split(' ');
        const [y,m,d] = date.split('-');
        return `${d}/${m}/${y} ${time||''}`;
    }

    // Mobile toggle
    const toggleBtn = document.getElementById('toggleListBtn');
    const sidebar = document.getElementById('sidebar');
    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▲' : '▼';
        if (sidebar.classList.contains('collapsed')) map.invalidateSize();
        else setTimeout(() => map.invalidateSize(), 300);
    });

    // Initialisation
    document.addEventListener("DOMContentLoaded", async () => {
        // Restauration thème
        const savedTheme = localStorage.getItem('themeMode');
        if (savedTheme === 'light') {
            nightMode = false;
            document.body.className = 'light';
            document.getElementById('themeBtn').innerText = '☀️';
        } else if (savedTheme === 'dark') {
            nightMode = true;
            document.body.className = '';
            document.getElementById('themeBtn').innerText = '🌙';
        } else {
            const hour = new Date().getHours();
            nightMode = !(hour >= 6 && hour < 21);
            document.body.className = nightMode ? '' : 'light';
            document.getElementById('themeBtn').innerText = nightMode ? '🌙' : '☀️';
            localStorage.setItem('themeMode', nightMode ? 'dark' : 'light');
        }

        // Restauration fond de carte
        const savedMapLayer = localStorage.getItem('mapLayer');
        const initialLayer = savedMapLayer || 'dark';
        currentMapLayer = initialLayer;
        document.getElementById('mapLayerSelect').value = initialLayer;
        updateMarkerColor();

        map = L.map('map', { zoomControl: false, maxZoom: 14 }).setView(center, 10);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        layerGroup = L.layerGroup().addTo(map);
        changeMapLayer(initialLayer);

        document.getElementById('apiKeyField').focus();
        document.getElementById('apiKeyField').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); startRadar(); }
        });

        map.on('click', (e) => {
            center = [e.latlng.lat, e.latlng.lng];
            currentSpeciesCode = null;
            speciesChecklists = {};
            document.getElementById('searchInput').value = '';
            if (userApiKey) runScan();
        });

        // GitHub popup
        const githubContainer = document.getElementById('githubContainer');
        const githubPopup = document.getElementById('githubPopup');
        let githubTimeout;
        githubContainer.addEventListener('mouseenter', () => { clearTimeout(githubTimeout); githubPopup.style.display = 'block'; });
        githubContainer.addEventListener('mouseleave', () => { githubTimeout = setTimeout(() => githubPopup.style.display = 'none', 200); });
        githubPopup.addEventListener('mouseenter', () => clearTimeout(githubTimeout));
        githubPopup.addEventListener('mouseleave', () => { githubTimeout = setTimeout(() => githubPopup.style.display = 'none', 200); });

        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('autocompleteList').style.display = 'none';
                clearTimeout(autocompleteTimer);
                if (currentSpeciesCode) fetchSpeciesChecklists(currentSpeciesCode);
                else renderChecklists();
            }
        });

        // Connexion automatique
        const autoLoggedIn = await tryAutoLogin();
        if (!autoLoggedIn) {
            document.getElementById('authScreen').classList.remove('hidden');
        } else {
            map.invalidateSize();
        }
    });
</script>
