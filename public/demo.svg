<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#071014" />
      <stop offset="1" stop-color="#072018" />
    </linearGradient>
    <style>
      .bg{fill:url(#g)}
      .bird{fill:#10b981;opacity:0.95}
    </style>
  </defs>
  <rect class="bg" width="800" height="220" rx="12" />

  <!-- simple moving "birds" -->
  <g>
    <circle class="bird" cx="-20" cy="40" r="6">
      <animate attributeName="cx" dur="6s" repeatCount="indefinite" from="-20" to="820" />
      <animate attributeName="cy" dur="3s" repeatCount="indefinite" values="40;30;45;40" />
    </circle>
    <circle class="bird" cx="820" cy="80" r="5" opacity="0.85">
      <animate attributeName="cx" dur="5s" repeatCount="indefinite" from="820" to="-20" />
      <animate attributeName="cy" dur="4s" repeatCount="indefinite" values="80;70;95;80" />
    </circle>
    <circle class="bird" cx="-40" cy="140" r="7" opacity="0.9">
      <animate attributeName="cx" dur="7s" repeatCount="indefinite" from="-40" to="840" />
      <animate attributeName="cy" dur="3.5s" repeatCount="indefinite" values="140;130;155;140" />
    </circle>
  </g>

  <g transform="translate(24,24)">
    <text x="0" y="30" fill="#e6fff1" font-family="Segoe UI, system-ui, sans-serif" font-size="20">Lecteur API eBird — Aperçu</text>
    <text x="0" y="58" fill="#9fdac0" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Visualisez les checklists, sélectionnez une zone et exportez vos données</text>
  </g>

</svg>