<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Recherche eBird — Carte</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
    #top{padding:12px;background:#0b5;display:flex;gap:8px;align-items:center;position:relative}
    #search{flex:1;padding:8px;font-size:16px}
    #suggestions{position:absolute;background:#fff;border:1px solid #ccc;max-height:200px;overflow:auto;z-index:1000;display:none}
    #map{height:78vh}
    .suggestion{padding:6px;cursor:pointer}
    .suggestion:hover{background:#eef}
  </style>
</head>
<body>
  <div id="top">
    <input id="search" placeholder="Tape le nom d'une espèce ex: merle" />
    <button id="loc">Ma position</button>
    <select id="radius"><option value="25">25 km</option><option value="50" selected>50 km</option><option value="100">100 km</option></select>
    <div id="suggestions"></div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Adapter API_BASE selon la plateforme
    // Vercel use '/api/ebird'
    // Netlify use '/.netlify/functions/ebird'
    const API_BASE = '/api/ebird';

    const map = L.map('map').setView([48.8566,2.3522], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
    let markers = L.layerGroup().addTo(map);

    const search = document.getElementById('search');
    const suggestionsBox = document.getElementById('suggestions');
    const radiusSelect = document.getElementById('radius');

    let timer;
    search.addEventListener('input', () => {
      clearTimeout(timer);
      const q = search.value.trim();
      if (!q) { suggestionsBox.style.display='none'; return; }
      timer = setTimeout(async () => {
        const r = await fetch(`${API_BASE}?q=${encodeURIComponent(q)}`);
        if (!r.ok) { suggestionsBox.style.display='none'; return; }
        const data = await r.json();
        suggestionsBox.innerHTML = '';
        if (!Array.isArray(data) || data.length===0) { suggestionsBox.style.display='none'; return; }
        data.slice(0,10).forEach(item => {
          const div = document.createElement('div');
          div.className='suggestion';
          div.textContent = `${item.comName || item.sciName} — ${item.speciesCode}`;
          div.dataset.code = item.speciesCode;
          div.dataset.name = item.comName || item.sciName;
          div.onclick = () => selectSpecies(div.dataset.code, div.dataset.name);
          suggestionsBox.appendChild(div);
        });
        const rect = search.getBoundingClientRect();
        suggestionsBox.style.left = rect.left + 'px';
        suggestionsBox.style.top = (rect.bottom + window.scrollY) + 'px';
        suggestionsBox.style.width = rect.width + 'px';
        suggestionsBox.style.display = 'block';
      }, 350);
    });

    async function selectSpecies(code, name) {
      suggestionsBox.style.display='none';
      search.value = name + ' ('+code+')';
      let lat=48.8566, lng=2.3522;
      try {
        const pos = await getPosition(5000);
        lat = pos.coords.latitude; lng = pos.coords.longitude;
        map.setView([lat,lng], 8);
      } catch(e) {}
      await loadObservations(code, lat, lng, radiusSelect.value);
    }

    async function loadObservations(speciesCode, lat, lng, distKm) {
      markers.clearLayers();
      const url = `${API_BASE}?speciesCode=${encodeURIComponent(speciesCode)}&lat=${lat}&lng=${lng}&dist=${distKm}&back=30&maxResults=500`;
      const r = await fetch(url);
      if (!r.ok) {
        alert('Erreur serveur ' + r.status);
        return;
      }
      const data = await r.json();
      if (!Array.isArray(data) || data.length===0) {
        alert('Aucune observation récente trouvée dans la zone.');
        return;
      }
      data.forEach(obs => {
        if (obs.lat && obs.lng) {
          const m = L.circleMarker([obs.lat, obs.lng], {radius:6, color:'#d00'}).bindPopup(
            `<b>${obs.comName}</b><br>${obs.obsDt}<br>${obs.locName || ''}`
          );
          markers.addLayer(m);
        }
      });
      map.fitBounds(markers.getBounds(), {maxZoom:10});
    }

    function getPosition(timeout=10000) {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('No geolocation'));
        navigator.geolocation.getCurrentPosition(resolve, reject, {timeout});
      });
    }

    document.getElementById('loc').addEventListener('click', async () => {
      try {
        const pos = await getPosition();
        map.setView([pos.coords.latitude, pos.coords.longitude], 8);
      } catch(e) {
        alert('Impossible de récupérer la position.');
      }
    });

    document.addEventListener('click', (e) => {
      if (!suggestionsBox.contains(e.target) && e.target !== search) suggestionsBox.style.display='none';
    });
  </script>
</body>
</html>
